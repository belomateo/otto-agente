# Configuración de Supabase para las Edge Functions de logica. Solo lo necesario para
# desplegar: el resto de la configuración del proyecto vive en el dashboard.
project_id = "fhyuvdliwppqkneddezn"

# Meta no manda un JWT de Supabase: la autenticidad del webhook se prueba con la firma
# X-Hub-Signature-256 (firma.ts).
[functions.webhook-whatsapp]
verify_jwt = false

# Lo llaman la base (trigger al encolar y cron de contención) con x-worker-secret, no con un
# JWT de usuario. Desde 2.1 corre el turno de Lucía, que lee _shared/prompt.md en tiempo de
# ejecución: el archivo viaja con la función.
[functions.worker]
verify_jwt = false
static_files = ["./functions/_shared/prompt.md"]

# Los envíos por plantilla (1.14): la llaman los crons de 0022 con x-worker-secret.
[functions.cron-envios]
verify_jwt = false

# El analista de charlas (0102, 10/10): lo llaman el cron de las 03:00 (y el de contención de las
# 04:00) y su propio relevo, con x-worker-secret. Lee _shared/prompt.md (las reglas de Lucía) en
# tiempo de ejecución, como el worker: el archivo viaja con la función.
[functions.analista]
verify_jwt = false
static_files = ["./functions/_shared/prompt.md"]
